<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixer Visuals - Kirish</title>
  <style>
    @font-face {
      font-family: 'Onest';
      src: url('../assets/fonts/Onest-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'Onest';
      src: url('../assets/fonts/Onest-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal;
    }
    @font-face {
      font-family: 'Onest';
      src: url('../assets/fonts/Onest-SemiBold.ttf') format('truetype');
      font-weight: 600; font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1120px; height: 650px;
      overflow: hidden;
      background: #0D0D0F;
      font-family: 'Onest', sans-serif;
      user-select: none;
    }

    #app { opacity: 0; transition: opacity 0.22s ease; }
    body.ready #app { opacity: 1; }

    .app {
      width: 1120px; height: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #141417;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      gap: 24px;
      padding: 40px;
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .auth-logo-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00f0ff, #b44dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    .auth-title {
      font-weight: 600; font-size: 24px;
      color: #FFFFFF;
    }

    .auth-subtitle {
      font-weight: 400; font-size: 13px;
      color: #656571;
      text-align: center;
      max-width: 400px;
      line-height: 18px;
    }

    .auth-input {
      width: 400px;
      padding: 14px 16px;
      background: #1C1C20;
      border: 1px solid #2A2A30;
      border-radius: 12px;
      color: #FFFFFF;
      font-family: 'Onest', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    .auth-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    .auth-input::placeholder {
      color: #555;
      letter-spacing: 1px;
      text-transform: none;
    }

    .auth-btn {
      width: 400px;
      padding: 14px;
      background: #14CF7E;
      box-shadow: 0 0 30px rgba(20,207,126,0.5);
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      font-family: 'Onest', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .auth-btn:hover { background: #10B06A; box-shadow: 0 0 40px rgba(16,176,106,0.7); }
    .auth-btn:disabled { background: #2A2A2F; box-shadow: none; color: #6B6B73; cursor: not-allowed; }

    .auth-error {
      color: #FF6363;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .auth-help {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .auth-help-text {
      font-size: 12px;
      color: #656571;
    }

    .auth-help-link {
      font-size: 12px;
      color: #00f0ff;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s;
    }

    .auth-help-link:hover { color: #66f5ff; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="auth-logo">
      <div class="auth-logo-icon">MV</div>
      <div class="auth-title">Mixer Visuals</div>
      <div class="auth-subtitle">
        O'ynashni boshlash uchun saytdagi email va parolingiz bilan kiring.<br>
        Bitta kompyuterda faqat bitta akkount ishlaydi.
      </div>
    </div>

    <input class="auth-input" id="emailInput" type="text" placeholder="Email" autocomplete="off" spellcheck="false">
    <input class="auth-input" id="passInput" type="password" placeholder="Parol" autocomplete="off">

    <div class="auth-error" id="errorMsg"></div>

    <button class="auth-btn" id="loginBtn">Kirish</button>

    <div class="auth-help">
      <span class="auth-help-text">Akkountingiz yo'qmi?</span>
      <a class="auth-help-link" id="siteLink">Saytda ro'yxatdan o'tish</a>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    function navigateTo(url) {
      window.location.href = url;
    }

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => {
        document.body.classList.add('ready');
        if (typeof window.nativeReady === 'function') window.nativeReady().catch(() => {});

        // Try restore
        window.nativeAuthTryRestore?.().then(ok => {
          if (ok === true || ok === 'true') {
            navigateTo('dashboard.html');
          }
        }).catch(() => {});

        emailInput.focus();
      });
    });

    emailInput.addEventListener('input', () => { errorMsg.textContent = ''; });
    passInput.addEventListener('input', () => { errorMsg.textContent = ''; });

    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = emailInput.value.trim();
      const password = passInput.value;
      if (!email || !password) {
        errorMsg.textContent = 'Email va parolni kiriting';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Tekshirilmoqda...';
      errorMsg.textContent = '';

      try {
        const result = await window.nativeAuthLogin?.(email, password);
        if (result?.success) {
          navigateTo('dashboard.html');
        } else {
          errorMsg.textContent = result?.error || 'Xatolik yuz berdi';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Kirish';
        }
      } catch (e) {
        errorMsg.textContent = 'Xatolik: ' + e.message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Kirish';
      }
    }

    loginBtn.addEventListener('click', doLogin);

    document.getElementById('siteLink').addEventListener('click', () => {
      window.nativeOpenUrl?.('http://localhost:4173');
    });
  </script>
</body>
</html>
